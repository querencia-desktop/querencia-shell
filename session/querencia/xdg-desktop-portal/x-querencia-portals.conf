# xdg-desktop-portal: Backends für XDG_CURRENT_DESKTOP=X-Querencia (QD-062,
# G2-AI; QD-077). Ohne diese Datei wählt xdg-desktop-portal das GTK-Backend nur
# als „last-resort fallback“, einzeln für jede Schnittstelle. GTK für alles,
# Secret über gnome-keyring. Kein „*“ als Rückfall: auf Ubuntu Desktop zieht
# er xdg-desktop-portal-gnome heran, das an Requisite=graphical-session.target
# scheitert; jedes Programm wartet dann rund zwei Minuten auf das Portal
# (KOEX-1, VM 116; ohne „*“ antwortet Settings.ReadOne in 174 ms).
# Ort: ~/.config/xdg-desktop-portal/ bzw. im Paket /usr/share/xdg-desktop-portal/.
[preferred]
default=gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
