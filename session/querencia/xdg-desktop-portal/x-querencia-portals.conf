# xdg-desktop-portal: Backends für XDG_CURRENT_DESKTOP=X-Querencia (QD-062,
# G2-AI). Ohne diese Datei wählt xdg-desktop-portal das GTK-Backend nur als
# „last-resort fallback“, einzeln für jede Schnittstelle. GTK zuerst, für
# Schnittstellen ohne GTK-Backend (z. B. Secret: gnome-keyring) jedes andere.
# Ort: ~/.config/xdg-desktop-portal/ bzw. im Paket /usr/share/xdg-desktop-portal/.
[preferred]
default=gtk;*
