<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title description">
  <title id="title">Querencia Lautstärkeregler</title>
  <desc id="description">Lautsprecher in Grau mit Schallwellen in Querencia-Orange (#F07746), davor ein Schieberegler; flächig.</desc>
  <!-- Lautsprecher -->
  <path d="M6 20 H17 L31 7 V49 L17 36 H6 Z" fill="#5a5a5a" stroke="#3c3c3c" stroke-width="3" stroke-linejoin="round"/>
  <!-- Schallwellen -->
  <path d="M38 19 A11 11 0 0 1 38 37" fill="none" stroke="#F07746" stroke-width="5" stroke-linecap="round"/>
  <path d="M44 12 A20 20 0 0 1 44 44" fill="none" stroke="#F07746" stroke-width="5" stroke-linecap="round"/>
  <!-- Schieberegler: Schiene grau, Knopf orange -->
  <rect x="8" y="53" width="48" height="6" rx="3" fill="#c9c6c2" stroke="#5a5a5a" stroke-width="2"/>
  <rect x="34" y="49" width="10" height="14" rx="2" fill="#F07746" stroke="#3c3c3c" stroke-width="2"/>
</svg>
