[package]
name = "querencia-desktop"
version = "0.2.3"
description = "Querencia Desktop: Arbeitsfläche (Hintergrund, Symbole, Kontextmenü) als Layer-Shell-Ebenen"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The same crates and versions as querencia-panel: no new package in
# Cargo.lock, offline builds keep working.
gio-unix = "0.22"
gtk4 = { version = "0.11", features = ["v4_10"] }
gtk4-layer-shell = "0.8.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(querencia_desktop)"] }
