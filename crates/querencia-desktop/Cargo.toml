[package]
name = "querencia-desktop"
version = "0.1.0"
description = "Querencia Desktop: Arbeitsfläche (Hintergrund, später Symbole) als Layer-Shell-Hintergrundebene"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The same crates and versions as querencia-panel: no new package in
# Cargo.lock, offline builds keep working.
gtk4 = { version = "0.11", features = ["v4_10"] }
gtk4-layer-shell = "0.8.1"
