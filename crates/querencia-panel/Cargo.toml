[package]
name = "querencia-panel"
version = "0.4.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# Translations through GNU gettext (po/, .mo under share/locale), as
# Querencia Desktop and the other programs: gettext-system uses the gettext
# of glibc instead of building libintl.
gettext-rs = { version = "0.8", features = ["gettext-system"] }
gio-unix = "0.22"
glib-unix = "0.22"
# v4_6: MenuButton::set_child for the classic "Anwendungen" button with logo
# (GTK 4.22 is installed; no new crate, Cargo.lock unchanged).
gtk4 = { version = "0.11", features = ["v4_10"] }
gtk4-layer-shell = "0.8.1"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# G2-J: audio service, icons and mixer ID of the volume applet (own crate of
# the workspace; libpulse is opened at run time, no new external crate).
querencia-lautstaerke = { path = "../querencia-lautstaerke" }
# G2-M: network state for the network applet (own crate of the workspace;
# NetworkManager through GIO's D-Bus, no new external crate).
querencia-netzwerk = { path = "../querencia-netzwerk" }
# Classic menus, icons without preloading, icon theme, colour scheme and
# settings portal, shared with querencia-desktop (own crate of the workspace,
# no new external crate).
querencia-oberflaeche = { path = "../querencia-oberflaeche" }

[dev-dependencies]
# The isolated GUI test of the classic menus (menu_gui_test.rs); only for
# the tests, the release build has no test code of the library.
querencia-oberflaeche = { path = "../querencia-oberflaeche", features = ["gui-test"] }
