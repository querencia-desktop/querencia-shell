[package]
name = "querencia-panel"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
gio-unix = "0.22"
glib-unix = "0.22"
# v4_6: MenuButton::set_child for the classic "Anwendungen" button with logo
# (GTK 4.22 is installed; no new crate, Cargo.lock unchanged).
gtk4 = { version = "0.11", features = ["v4_6"] }
gtk4-layer-shell = "0.8.1"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
