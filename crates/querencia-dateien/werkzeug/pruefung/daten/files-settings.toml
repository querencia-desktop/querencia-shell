# Probe einer Querencia-Files-settings.toml für die Migration M6 (B §4.2)
browser_mode = "columns"
show_hidden = true
sort_key = "modified"
folders_first = true
grid_folder_clicks = 1
list_folder_clicks = 1
# Files QF-0t: list_* gilt für die Spaltenansicht (columns); Einfacher Klick
# nur, wenn dort Ordner und Dateien mit einem Klick öffnen (Welle C3)
list_file_clicks = 1
sidebar_expanded = true
check_for_updates = true

[tabs]
show_hidden = false
