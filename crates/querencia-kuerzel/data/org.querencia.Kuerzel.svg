<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Querencia Tastenkürzel – Tastatur in Querencia-Orange mit Fragezeichen-Taste</title>
  <!-- Querencia-Stil wie Rechner und Sitzung: Körper in Querencia-Orange
       (#F07746) mit dunklem Rand (#B8532B), helle Tasten (#FFF4EE). Eine
       große weiße Taste mit „?“ steht für die Übersicht (Super+?).
       Nur als SVG installiert (Symbolregel: nie 48x48 und Scalable
       zugleich, GTK-4.22-Symbolabsturz). -->
  <rect x="3" y="17" width="58" height="38" rx="6" ry="6" fill="#F07746" stroke="#B8532B" stroke-width="1.5"/>
  <g fill="#FFF4EE">
    <rect x="8" y="22" width="7" height="6" rx="1.5"/><rect x="17" y="22" width="7" height="6" rx="1.5"/><rect x="26" y="22" width="7" height="6" rx="1.5"/>
    <rect x="8" y="31" width="7" height="6" rx="1.5"/><rect x="17" y="31" width="7" height="6" rx="1.5"/><rect x="26" y="31" width="7" height="6" rx="1.5"/>
    <rect x="8" y="40" width="7" height="6" rx="1.5"/><rect x="17" y="40" width="7" height="6" rx="1.5"/><rect x="26" y="40" width="7" height="6" rx="1.5"/>
    <rect x="12" y="48.5" width="40" height="3.5" rx="1.5"/>
  </g>
  <!-- die große Taste -->
  <rect x="36.5" y="7" width="22" height="24" rx="4" ry="4" fill="#B8532B" opacity="0.35" transform="translate(1.5 2)"/>
  <rect x="36.5" y="7" width="22" height="24" rx="4" ry="4" fill="#FFFFFF" stroke="#B8532B" stroke-width="1.5"/>
  <rect x="39" y="9" width="17" height="17" rx="3" ry="3" fill="#FFF4EE"/>
  <text x="47.5" y="24" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="17" text-anchor="middle" fill="#3C3C3C">?</text>
</svg>
